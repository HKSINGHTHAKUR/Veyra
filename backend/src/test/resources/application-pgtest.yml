spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/healthcare_appointments_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-abcdef-pgtest
    expiration-ms: 3600000
  slot:
    hold-duration-minutes: 5

logging:
  level:
    com.healthcare.appointment: INFO
